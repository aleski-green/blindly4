name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format and lint
        working-directory: windows
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed' }
      - name: Build native executable
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Install pinned Lean
        shell: pwsh
        run: |
          $version = (Get-Content spec/lean-toolchain).Trim().Replace('leanprover/lean4:v', '')
          $archive = "lean-$version-windows.zip"
          Invoke-WebRequest "https://github.com/leanprover/lean4/releases/download/v$version/$archive" -OutFile "$env:RUNNER_TEMP/$archive"
          Expand-Archive "$env:RUNNER_TEMP/$archive" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/lean-$version-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Lean CLI behavior
        shell: pwsh
        run: |
          lake -d spec test
          if ($LASTEXITCODE) { throw 'Lean tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: blindly4-${{ matrix.runtime }}
          path: .build/windows/
          include-hidden-files: true
