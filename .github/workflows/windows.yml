name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained executable
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Permission-free checks and schema
        shell: pwsh
        run: |
          & ./.build/windows/blindly4.exe --self-test
          if ($LASTEXITCODE) { throw 'Self-test failed' }
          & ./.build/windows/blindly4.exe schema
          if ($LASTEXITCODE) { throw 'Schema failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: blindly4-${{ matrix.runtime }}
          path: .build/windows/
          include-hidden-files: true
