name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format and lint
        working-directory: windows
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed' }
      - name: Build native executable
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.runtime }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: RSpec CLI behavior
        run: |
          bundle install
          bundle exec rspec
      - uses: actions/upload-artifact@v4
        with:
          name: blindly4-${{ matrix.runtime }}
          path: .build/windows/
          include-hidden-files: true
