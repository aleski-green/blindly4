name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format and lint
        run: |
          cargo fmt --manifest-path macos/Cargo.toml --check
          cargo clippy --locked --manifest-path macos/Cargo.toml --all-targets -- -D warnings
      - name: Native release build
        run: ./macos/build.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: RSpec CLI behavior
        env:
          BLINDLY4_BIN: .build/release/blindly4
        run: bundle exec rspec
      - name: Package native binary
        uses: actions/upload-artifact@v4
        with:
          name: blindly4-macos-${{ runner.arch }}
          path: |
            .build/release/blindly4
            license/
            macos/THIRD_PARTY_NOTICES.md
            README.md
          if-no-files-found: error
          include-hidden-files: true
