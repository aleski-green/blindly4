name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format and lint
        run: |
          cargo fmt --manifest-path macos/Cargo.toml --check
          cargo clippy --manifest-path macos/Cargo.toml --all-targets -- -D warnings
      - name: Native release build
        run: ./macos/build.sh
      - name: Install pinned Lean
        shell: bash
        run: |
          version=$(sed 's|leanprover/lean4:v||' spec/lean-toolchain)
          platform=darwin
          if [ "$(uname -m)" = arm64 ]; then platform=darwin_aarch64; fi
          archive="lean-$version-$platform.tar.zst"
          curl --fail --location --retry 3 "https://github.com/leanprover/lean4/releases/download/v$version/$archive" -o "$RUNNER_TEMP/$archive"
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-$version-$platform/bin" >> "$GITHUB_PATH"
      - name: Lean CLI behavior
        env:
          BLINDLY4_BIN: .build/release/blindly4
        run: lake -d spec test
      - name: Package native binary
        uses: actions/upload-artifact@v4
        with:
          name: blindly4-macos-${{ runner.arch }}
          path: |
            .build/release/blindly4
            license/
            README.md
          if-no-files-found: error
          include-hidden-files: true
