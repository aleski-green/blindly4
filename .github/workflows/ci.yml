name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: RSpec CLI behavior
        run: bundle exec rspec
      - name: Package test binary
        uses: actions/upload-artifact@v4
        with:
          name: blindly4-${{ runner.arch }}
          path: |
            .build/debug/blindly4
            license/LICENSE.md
            license/LICENSING.md
            README.md
          if-no-files-found: error
          include-hidden-files: true
