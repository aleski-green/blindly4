[package]
name = "blindly4"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false
license-file = "../license/LICENSE.md"
description = "Native Linux accessibility CLI"

[[bin]]
name = "blindly4"
path = "../shared/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2"
zbus = "5"
x11rb = { version = "0.13", features = ["xtest", "res"] }

[profile.release]
lto = "thin"
strip = true
