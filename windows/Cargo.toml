[package]
name = "blindly4"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license-file = "../license/LICENSE.md"
description = "Stateless Windows UI Automation CLI"

[[bin]]
name = "blindly4"
path = "../shared/main.rs"

[dependencies]
serde_json = "1"
unicode-normalization = "0.1"
url = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
